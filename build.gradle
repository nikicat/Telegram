// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://developer.huawei.com/repo/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1'
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.github.triplet.gradle:play-publisher:3.12.1'
        classpath 'com.huawei.agconnect:agcp:1.9.1.301'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20"
    }
}
repositories {
    google()
}

// Per-machine overrides from local.properties (gitignored), readable from every
// module — subprojects inherit root ext properties. Named hostProp so it does not
// collide with the modules' own local.properties helpers (localProp/getProps).
// Used for cmake.version: hosts without Google's x86_64-only SDK cmake package
// (e.g. aarch64, see docs/arm64-host.md) point AGP at their own CMake via
// cmake.dir + cmake.version instead.
ext.hostProp = { String key, String fallback = null ->
    def f = rootProject.file('local.properties')
    if (!f.exists()) return fallback
    def p = new Properties()
    f.withInputStream { p.load(it) }
    return p.getProperty(key) ?: fallback
}
