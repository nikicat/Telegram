apply plugin: 'com.android.application'

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

// Read local.properties (gitignored, per-machine overrides).
def _localProps = new Properties()
def _localFile = rootProject.file('local.properties')
if (_localFile.exists()) _localProps.load(new FileInputStream(_localFile))
def localProp = { String k -> _localProps.getProperty(k) }

// Effective base applicationId (app.id override, else the upstream package). Single source of truth
// for the build: drives applicationId, the AAB archive name, and Google Services config resolution.
def _effectiveAppId = localProp('app.id') ?: APP_PACKAGE

// Name AABs by app.id so the bundle carries its app.id in its path
// (build/outputs/bundle/.../<app.id>-<flavor>-<buildtype>.aab). APKs are named in applicationVariants.
base {
    archivesName = _effectiveAppId
}

// Resolve signing config: prefer local.properties -> keystore.file -> debug.properties chain
// (mirroring Telegram-X); fall back to gradle.properties RELEASE_* + bundled release.keystore.
def _signingFromLocalProps = {
    def local = rootProject.file('local.properties')
    if (!local.exists()) return null
    def lp = new Properties(); lp.load(new FileInputStream(local))
    def ksPath = lp['keystore.file']; if (!ksPath) return null
    def ksFile = new File(ksPath as String); if (!ksFile.exists()) return null
    def ks = new Properties(); ks.load(new FileInputStream(ksFile))
    return [
        storeFile    : file(ks['keystore.file']),
        storePassword: ks['keystore.password'],
        keyAlias     : ks['key.alias'],
        keyPassword  : ks['key.password'],
    ]
}()

android {
    compileSdkVersion 35
    buildToolsVersion '35.0.0'

    // app.id overrides APP_PACKAGE; applicationIdSuffix (.debug/.web) still applies on top.
    defaultConfig.applicationId = _effectiveAppId
    // app.name overrides ${appLabel} in debug manifests; release manifests use @string/AppName.
    defaultConfig.manifestPlaceholders = [appLabel: localProp('app.name') ?: '@string/AppNameBeta']
    // ...so also override that string, which lives in the TMessagesProj library: a resource
    // declared by the app module wins over the library's. This makes app.name the single
    // source of truth for the name in every build type (and everywhere the app prints it).
    if (localProp('app.name')) {
        defaultConfig.resValue "string", "AppName", localProp('app.name')
    }

    sourceSets.main.jniLibs.srcDirs = ['../TMessagesProj/jni/']

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    signingConfigs {
        debug {
            storeFile     _signingFromLocalProps?.storeFile     ?: file("../TMessagesProj/config/release.keystore")
            storePassword _signingFromLocalProps?.storePassword ?: RELEASE_STORE_PASSWORD
            keyAlias      _signingFromLocalProps?.keyAlias      ?: RELEASE_KEY_ALIAS
            keyPassword   _signingFromLocalProps?.keyPassword   ?: RELEASE_KEY_PASSWORD
        }

        release {
            storeFile     _signingFromLocalProps?.storeFile     ?: file("../TMessagesProj/config/release.keystore")
            storePassword _signingFromLocalProps?.storePassword ?: RELEASE_STORE_PASSWORD
            keyAlias      _signingFromLocalProps?.keyAlias      ?: RELEASE_KEY_ALIAS
            keyPassword   _signingFromLocalProps?.keyPassword   ?: RELEASE_KEY_PASSWORD
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
            ndk.debugSymbolLevel = 'FULL'
        }

        standalone {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            applicationIdSuffix ".web"
            minifyEnabled true
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }

        release {
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest.xml'
    }

    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    sourceSets.release {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        bundleAfat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            ext {
                abiVersionCode = 1
            }
            buildConfigField "boolean", "BUNDLE", "true"
        }
        bundleAfatArm64 {
            ndk {
                abiFilters "arm64-v8a"
            }
            ext {
                abiVersionCode = 3
            }
            buildConfigField "boolean", "BUNDLE", "true"
        }
        bundleAfat_SDK23 {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            minSdkVersion 23
            ext {
                abiVersionCode = 2
            }
            buildConfigField "boolean", "BUNDLE", "true"
        }
        afat {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
            ext {
                abiVersionCode = 9
            }
            buildConfigField "boolean", "BUNDLE", "false"
        }
        afatX64 {
            ndk {
                abiFilters "x86_64"
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
            ext {
                abiVersionCode = 10
            }
            buildConfigField "boolean", "BUNDLE", "false"
        }
        afatArm64 {
            ndk {
                abiFilters "arm64-v8a"
            }
            sourceSets.debug {
                manifest.srcFile '../TMessagesProj/config/debug/AndroidManifest_SDK23.xml'
            }
            sourceSets.release {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_SDK23.xml'
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
            ext {
                abiVersionCode = 11
            }
            buildConfigField "boolean", "BUNDLE", "false"
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // Name the APK by its applicationId (incl. build-type suffix) so the binary carries its
            // app.id in its path: build/outputs/apk/afat<abi>/<build>/<applicationId>.apk
            outputFileName = "${variant.applicationId}.apk"
            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat") && !names.contains("afatX64") && !names.contains("afatArm64")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35
        versionName APP_VERSION_NAME
        ndkVersion "27.2.12479018"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version hostProp('cmake.version', '3.10.2')
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' // , '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.regular'

    lintOptions {
        checkReleaseBuilds false
    }
}

// ----- Firebase / Google Services -----
// The Google Services config is app.id-bound, so it is resolved BY app.id and configs for different
// app.ids coexist side by side. The resolved file is gitignored and staged here before the plugin
// runs, so a custom app.id ships its own Firebase project without dirtying the tracked default:
//   * no app.id override -> google-services.default.json (org.telegram.messenger*); upstream/CI unchanged.
//   * app.id set         -> first of:
//       1. google-services.file               (local.properties) — explicit exact-path override, or
//       2. <google-services.dir>/google-services.<app.id>.json   — per-app-id convention (dir defaults
//          to "keystore"); drop one file per app.id and switching app.id picks the matching one, or
//       3. none found     -> skip the plugin (build works; Firebase/push disabled).
// A resolved config must register a client for app.id AND every build-type suffix (release: none,
// debug: .debug, standalone: .web). We verify that here and fail with a clear message instead of
// letting the gms plugin fail late with a cryptic "No matching client found for package name".
def _gsCustomAppId = localProp('app.id')
def _gsBaseAppId = _effectiveAppId
def _gsExplicitFile = localProp('google-services.file')
def _gsDir = localProp('google-services.dir') ?: 'keystore'
def _gsByAppId = rootProject.file("${_gsDir}/google-services.${_gsBaseAppId}.json")
def _gsSource
if (!_gsCustomAppId) {
    _gsSource = file("$projectDir/google-services.default.json")
} else if (_gsExplicitFile) {
    _gsSource = file(_gsExplicitFile)
    if (!_gsSource.exists()) throw new GradleException("google-services.file not found: $_gsSource")
} else {
    _gsSource = _gsByAppId.exists() ? _gsByAppId : null
}
if (_gsSource != null) {
    def _gsExpected = ['', '.debug', '.web'].collect { _gsBaseAppId + it }   // release / debug / standalone
    def _gsPkgs = new groovy.json.JsonSlurper().parse(_gsSource)
            .client.collect { it.client_info.android_client_info.package_name } as Set
    def _gsMissing = _gsExpected.findAll { !_gsPkgs.contains(it) }
    if (_gsMissing) {
        throw new GradleException(
                "google-services config does not match app.id.\n" +
                "  config:  ${_gsSource}\n" +
                "  app.id:  ${_gsBaseAppId}\n" +
                "  missing: ${_gsMissing.join(', ')}\n" +
                "  has:     ${(_gsPkgs as List).sort().join(', ')}\n" +
                "Fix one of:\n" +
                "  - register the missing package name(s) in the Firebase project and re-download the config, or\n" +
                "  - set app.id (local.properties) to a value the config already covers, or\n" +
                "  - remove the config so the build runs without Firebase/push.")
    }
    copy {
        from _gsSource
        into projectDir
        rename { 'google-services.json' }
    }
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn("Google Services skipped for app.id '${_gsBaseAppId}' (Firebase/push disabled): " +
            "no config at ${_gsByAppId} and google-services.file not set in local.properties.")
}

// ----- Google Play publishing (Gradle Play Publisher) -----
// Applied only when a service-account key is configured, so normal builds/CI are unaffected. With it set,
// the publish<Variant> tasks upload the AAB + store listing (TMessagesProj_App/src/main/play/) to Play.
// The target package is the variant applicationId, so this is parametrized by app.id like the rest.
//   play.service-account.file  (local.properties) -> JSON key with Play access (required to enable)
//   play.track                 (local.properties) -> release track; defaults to "internal"
def _playKey = localProp('play.service-account.file')
if (_playKey) {
    def _playKeyFile = file(_playKey)
    if (!_playKeyFile.exists()) throw new GradleException("play.service-account.file not found: $_playKeyFile")
    apply plugin: 'com.github.triplet.play'
    play {
        serviceAccountCredentials = _playKeyFile
        track = localProp('play.track') ?: 'internal'
        defaultToAppBundles = true
    }
}
