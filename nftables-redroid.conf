#!/usr/sbin/nft -f
# Restrict redroid container to only reach the TUIC proxy (QUIC/UDP).
# REDROID_BRIDGE, TUIC_HOST, and TUIC_PORT are injected at apply time —
# the `firewall` just-recipe derives them from podman + local.properties.
# TUIC_PORT defaults to 443 if the proxy URL omits a port query param.
# Manual usage:
#   sudo podman compose up -d
#   BRIDGE=$(sudo podman network inspect telegram_redroid | python3 -c "import json,sys;print(json.load(sys.stdin)[0]['network_interface'])")
#   sudo nft -f nftables-redroid.conf -D REDROID_BRIDGE=$BRIDGE -D TUIC_HOST=1.2.3.4 -D TUIC_PORT=443
# To remove:
#   sudo nft delete table inet redroid_fw

table inet redroid_fw {
  chain forward {
    type filter hook forward priority 0; policy accept;

    # Only filter traffic from the redroid bridge
    iifname != $REDROID_BRIDGE accept

    # Allow established/related (return traffic)
    ct state established,related accept

    # TUIC over QUIC
    ip daddr $TUIC_HOST udp dport $TUIC_PORT accept

    # Block everything else from redroid
    drop
  }
}
