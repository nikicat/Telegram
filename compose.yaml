# Adapted from ../Telegram-X/compose.yaml.
# Host ADB port is 5556 (Telegram-X uses 5555) so both redroid containers
# can run concurrently on the same host.
#
# HOST PREREQUISITES (rootful podman — run with `sudo podman-compose up -d`):
#   1. subuid/subgid range for your user, so the image's Android UIDs/GIDs can
#      be mapped (otherwise `podman pull`/unpack fails with lchown errors):
#        sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 $USER
#        podman system migrate
#   2. loop + dm-verity kernel modules loaded, so apexd can mount the APEX
#      images. Without them the container exits immediately (status 129) before
#      Android even logs. Persisted in /etc/modules-load.d/redroid.conf:
#        loop
#        dm-verity
#
# GPU: we run guest (software) rendering. The x86_64 host this started on had an
# NVIDIA proprietary driver, which redroid's in-container mesa stack can't drive
# (host mode -> SurfaceFlinger "no suitable EGLConfig" crash loop). The current
# aarch64 host's Mali GPU *is* mesa-driven (panthor), but redroid 11's bundled
# mesa long predates that driver, so guest mode stays the pick on both. See the
# `command:` block and https://github.com/remote-android/redroid-doc/issues/282
#
# ARCH: the guest ABI follows the host — `redroid/redroid:11.0.0-latest` is a
# multi-arch tag, so on the aarch64 host podman pulls the arm64 image and the
# guest reports ro.product.cpu.abi=arm64-v8a. The justfile defaults the APK
# flavor to the host arch to match (see common.just, docs/arm64-host.md).

services:
  redroid:
    image: docker.io/redroid/redroid:11.0.0-latest
    # Android 11, not 12+, and stock redroid rather than a patched image:
    #   * teddynight/redroid16 (previously used here) carries the ashmem-memfd
    #     fix stock redroid >= 12 needs on kernels 5.18+, but it is published
    #     for amd64 only — unusable on this aarch64 host.
    #     (https://github.com/remote-android/redroid-patches/pull/5)
    #   * redroid >= 12 also cannot render software-decoded video in guest GPU
    #     mode: its Codec2 (c2.android.*) decoders emit YV12 buffers that the
    #     ashmem gralloc can't hand to ANGLE, so video plays audio over a black
    #     surface. Android 11 still uses the OMX decoders + SoftwareRenderer
    #     with redroid's YUV->RGB workaround, so media in chats actually renders.
    #     (redroid-doc#920, #552, #825; investigated in ../purpletube/docs/redroid.md)
    # Android 11 = API 30; the app's minSdk is 21, so this exercises the real
    # runtime paths. Test 12+ behaviour on a physical device (`just device ... device=<serial>`).
    privileged: true
    stdin_open: false
    tty: false
    # podman-compose: don't treat Android's /init as systemd
    annotations:
      io.podman.annotations.systemd: "false"
    networks:
      - redroid
    ports:
      - "5556:5555" # ADB (host:container)
    volumes:
      - ./redroid-data:/data # Persistent Android /data partition
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128 # GPU passthrough
      # apexd needs these to create loop and device-mapper devices.
      # Use 'devices' instead of bind mounts so they survive Android init's
      # /dev remounts and are properly cgroup-allowed.
      - /dev/loop-control:/dev/loop-control
      - /dev/mapper/control:/dev/mapper/control
    mem_limit: 4g
    # Android 16 creates ~550 property area files (128KB each, ~70MB total)
    # in /dev/__properties__/. Default crun /dev tmpfs is only 64MB → SIGBUS.
    tmpfs:
      - /dev:exec,mode=755,size=256m
    # Android's init ignores SIGRTMIN+3 (image default), skip the 10s timeout
    stop_signal: SIGKILL
    command:
      # host mode needs a mesa driver (Intel/AMD). The NVIDIA proprietary driver
      # isn't usable by redroid's in-container mesa EGL/gralloc, so SurfaceFlinger
      # crashes ("no suitable EGLConfig") and boot loops. See redroid-doc#282.
      # For a mesa GPU, swap back to:
      #   - androidboot.redroid_gpu_mode=host
      #   - androidboot.redroid_gpu_node=/dev/dri/renderD128
      # guest = software rendering (works everywhere, no GPU accel). This image
      # routes guest mode through ANGLE (ro.hardware.egl=angle), the fastest
      # software path here. For real NVIDIA accel, use a virtio-gpu VM (#282).
      - androidboot.redroid_gpu_mode=guest
      - androidboot.use_memfd=true
      # Uncomment to customize display:
      # - androidboot.redroid_width=1080
      # - androidboot.redroid_height=1920
      # - androidboot.redroid_fps=30
      # - androidboot.redroid_dpi=480

networks:
  redroid:
    driver: bridge
